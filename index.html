<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============ SEO ============ -->
  <title>Aditya | CSE Student &amp; Aspiring AI/ML Engineer</title>
  <meta name="description" content="Personal portfolio of Aditya, a first-semester Computer Science Engineering student building strong foundations with a long-term goal of becoming an AI/ML engineer." />
  <meta name="author" content="Aditya" />
  <meta name="theme-color" content="#07080f" />

  <!-- ============ Open Graph / social sharing ============ -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aditya | CSE Student &amp; Aspiring AI/ML Engineer" />
  <meta property="og:description" content="Personal portfolio of Aditya, a first-semester Computer Science Engineering student building foundations for a future in AI/ML." />
  <meta property="og:image" content="images/og-cover.svg" />
  <meta property="og:locale" content="en_US" />

  <!-- ============ Twitter card ============ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Aditya | CSE Student &amp; Aspiring AI/ML Engineer" />
  <meta name="twitter:description" content="Personal portfolio of Aditya, a first-semester CSE student and aspiring AI/ML engineer." />
  <meta name="twitter:image" content="images/og-cover.svg" />

  <!-- ============ Fonts (Inter for text, JetBrains Mono for code accents) ============ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- ============ Styles ============ -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- Skip link: helps keyboard + screen reader users jump straight to content -->
  <a class="skip-link" href="#home">Skip to main content</a>

  <!-- Decorative background glows (purely visual, hidden from screen readers) -->
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-glow bg-glow--blue"></span>
    <span class="bg-glow bg-glow--purple"></span>
    <span class="bg-glow bg-glow--cyan"></span>
    <span class="bg-grid"></span>
  </div>

  <!-- Navigation bar is rendered by js/components/navbar.js -->
  <header id="site-header" class="site-header"></header>

  <!-- All page sections are rendered by their own component files into this <main> -->
  <main id="main-content"></main>

  <!-- Footer is rendered by js/components/footer.js -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Back to top button is rendered by js/components/footer.js -->
  <div id="back-to-top-slot"></div>

  <noscript>
    <p style="padding:2rem;color:#e6e9f5;text-align:center">
      This portfolio uses JavaScript to build its sections. Please enable JavaScript to view the full site.
    </p>
  </noscript>

  <!-- Single entry point. type="module" lets us split the site into clean components. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
