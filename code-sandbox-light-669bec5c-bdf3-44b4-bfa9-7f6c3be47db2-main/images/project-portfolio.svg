<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Responsive portfolio website shown on a desktop and a phone">
  <defs>
    <linearGradient id="pfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120b22"/>
      <stop offset="100%" stop-color="#0d1330"/>
    </linearGradient>
    <linearGradient id="pfAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="pfGlow" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#pfBg)"/>
  <rect width="640" height="360" fill="url(#pfGlow)"/>

  <!-- desktop browser window -->
  <rect x="52" y="56" width="420" height="230" rx="14" fill="#0c1124" stroke="#4a3f80" stroke-width="2"/>
  <path d="M52 70a14 14 0 0 1 14-14h392a14 14 0 0 1 14 14v20H52z" fill="#100c22"/>
  <circle cx="74" cy="73" r="4.5" fill="#ff5f57"/>
  <circle cx="90" cy="73" r="4.5" fill="#febc2e"/>
  <circle cx="106" cy="73" r="4.5" fill="#28c840"/>
  <rect x="128" y="66" width="180" height="14" rx="7" fill="#ffffff" fill-opacity="0.14"/>

  <!-- desktop page content: hero block -->
  <rect x="76" y="108" width="130" height="10" rx="5" fill="url(#pfAccent)" opacity="0.9"/>
  <rect x="76" y="126" width="220" height="16" rx="8" fill="#ffffff" fill-opacity="0.34"/>
  <rect x="76" y="150" width="180" height="16" rx="8" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="76" y="180" width="86" height="26" rx="13" fill="url(#pfAccent)"/>
  <rect x="172" y="180" width="86" height="26" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.4"/>

  <!-- desktop page content: 3 cards -->
  <rect x="76" y="226" width="118" height="42" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="204" y="226" width="118" height="42" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="332" y="226" width="118" height="42" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>

  <!-- decorative avatar block on desktop right -->
  <rect x="332" y="108" width="118" height="98" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>
  <circle cx="391" cy="145" r="18" fill="none" stroke="url(#pfAccent)" stroke-width="2.6"/>
  <path d="M366 182c6-13 16-18 25-18s19 5 25 18" fill="none" stroke="url(#pfAccent)" stroke-width="2.6"/>

  <!-- phone mockup -->
  <rect x="492" y="96" width="104" height="200" rx="18" fill="#0c1124" stroke="#4a3f80" stroke-width="2"/>
  <rect x="528" y="104" width="32" height="5" rx="2.5" fill="#4a3f80"/>
  <rect x="504" y="122" width="46" height="7" rx="3.5" fill="url(#pfAccent)" opacity="0.9"/>
  <rect x="504" y="136" width="72" height="10" rx="5" fill="#ffffff" fill-opacity="0.34"/>
  <rect x="504" y="152" width="56" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="504" y="172" width="72" height="20" rx="10" fill="url(#pfAccent)"/>
  <rect x="504" y="200" width="72" height="26" rx="8" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="504" y="232" width="72" height="26" rx="8" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="504" y="264" width="72" height="20" rx="8" fill="#ffffff" fill-opacity="0.09"/>

  <!-- tech labels -->
  <g font-family="monospace" font-size="11">
    <rect x="52" y="306" width="58" height="26" rx="8" fill="#100c22" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="81" y="323" fill="#d8b4fe" text-anchor="middle">HTML</text>

    <rect x="118" y="306" width="48" height="26" rx="8" fill="#100c22" stroke="#3b82f6" stroke-opacity="0.45"/>
    <text x="142" y="323" fill="#93c5fd" text-anchor="middle">CSS</text>

    <rect x="174" y="306" width="42" height="26" rx="8" fill="#100c22" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="195" y="323" fill="#a5f3fc" text-anchor="middle">JS</text>
  </g>
</svg>
