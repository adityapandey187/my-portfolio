<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Aditya - Computer Science Engineering Student and Aspiring AI/ML Engineer">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="100%" stop-color="#0f1230"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.78" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>

  <!-- logo mark -->
  <rect x="96" y="120" width="72" height="72" rx="20" fill="url(#ogAccent)"/>
  <text x="132" y="172" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#fff" text-anchor="middle">A</text>

  <!-- text -->
  <text x="96" y="290" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" fill="#e9ecf8">Aditya</text>
  <text x="96" y="360" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="600" fill="#a7aec6">Computer Science Engineering Student &amp;</text>
  <text x="96" y="412" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#a855f7">Aspiring AI/ML Engineer</text>

  <!-- badge -->
  <rect x="96" y="456" width="470" height="50" rx="25" fill="#0e1428" stroke="#22d3ee" stroke-opacity="0.4"/>
  <circle cx="126" cy="481" r="7" fill="#22d3ee"/>
  <text x="146" y="488" font-family="monospace" font-size="19" fill="#b6f0fb">First Semester • CSE Foundations • AI/ML Goal</text>

  <!-- neural net decoration -->
  <g stroke="url(#ogAccent)" stroke-width="1.6" fill="none" opacity="0.5">
    <path d="M840 200 L960 170 M840 200 L960 300 M840 320 L960 170 M840 320 L960 300 M840 440 L960 170 M840 440 L960 300"/>
    <path d="M960 170 L1080 250 M960 300 L1080 250 M960 170 L1080 370 M960 300 L1080 370"/>
  </g>
  <g>
    <circle cx="840" cy="200" r="12" fill="#3b82f6"/>
    <circle cx="840" cy="320" r="12" fill="#3b82f6"/>
    <circle cx="840" cy="440" r="12" fill="#3b82f6"/>
    <circle cx="960" cy="170" r="12" fill="#a855f7"/>
    <circle cx="960" cy="300" r="12" fill="#a855f7"/>
    <circle cx="1080" cy="250" r="12" fill="#22d3ee"/>
    <circle cx="1080" cy="370" r="12" fill="#22d3ee"/>
  </g>

  <rect x="0" y="618" width="1200" height="12" fill="url(#ogAccent)"/>
